[package]
name = "cdd-gateway"
version = "0.0.1"
edition = "2021"

[dependencies]
cdd-engine = { git = "https://github.com/SamuelMarks/cdd-engine" }
actix-web = { version = "4.17", default-features = false, features = ["macros"] }
actix-cors = { version = "0.7", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
utoipa = { version = "6.0", default-features = false, features = ["macros"] }
utoipa-swagger-ui = { version = "10.0", default-features = false, features = ["actix-web", "vendored"] }
diesel = { version = "2.3", default-features = false, features = ["postgres", "r2d2"] }
tokio = { version = "1.54", default-features = false, features = ["macros", "rt-multi-thread", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
log = { version = "0.4", default-features = false }
env_logger = { version = "0.11", default-features = false }
derive_more = { version = "2.1", default-features = false, features = ["display", "from", "error"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
actix-web-httpauth = { version = "0.8", default-features = false }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "getrandom", "password-hash"] }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
async-trait = { version = "0.1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio-stream = { version = "0.1", default-features = false }
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
diesel_migrations = { version = "2.3", default-features = false }
httpmock = { version = "0.9", default-features = false }
mockall = { version = "0.15", default-features = false }
uuid = { version = "1.28", default-features = false, features = ["v4"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(tarpaulin_include)'] }

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = 0 # Disables debug symbols
