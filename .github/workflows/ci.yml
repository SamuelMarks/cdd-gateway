name: CI

on:
  push:
    branches: ["master"]
    tags:
      - 'v*'
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://postgres:password@localhost/cdd

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cdd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev gcc libpq-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Setup Database
        run: |
          cargo install diesel_cli --no-default-features --features postgres
          diesel setup --database-url postgres://postgres:password@localhost/cdd
          diesel migration run --database-url postgres://postgres:password@localhost/cdd

      - name: Fetch WASM artifacts
        run: ./scripts/fetch_wasm.sh

      - name: Run checks
        run: cargo check --verbose

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests & coverage
        run: cargo tarpaulin --verbose --workspace --timeout 600 --out xml --engine llvm

      - name: Build docs
        run: cargo doc --no-deps

  release:
    name: Build and Release
    needs: build_and_test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev gcc libpq-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu

      - name: Build Release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Create Release Archive
        run: |
          tar -czvf cdd-gateway-x86_64-unknown-linux-gnu.tar.gz -C target/x86_64-unknown-linux-gnu/release cdd-gateway

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: cdd-gateway-x86_64-unknown-linux-gnu.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
